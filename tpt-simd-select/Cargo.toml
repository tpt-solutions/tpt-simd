[package]
name = "tpt-simd-select"
description = "SIMD element selection by index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "select", "lanes", "index", "vector"]
categories = ["algorithms", "no-std", "hardware-support"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true
tpt-simd-blend = { path = "../tpt-simd-blend", version = "0.1.0" }
tpt-simd-gather = { path = "../tpt-simd-gather", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
tpt-simd-testutil.workspace = true

[lints]
workspace = true
