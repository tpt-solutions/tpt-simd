name: Bench

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Criterion's defaults (3 s warm-up, 5 s measurement per benchmark) across roughly a thousand
      # benchmarks overrun the 90-minute limit. The shorter budget keeps the full workspace run
      # inside it; the baseline is saved and compared with the same settings on every run.
      - name: Run criterion benchmarks (AVX2+FMA)
        run: cargo bench --workspace --benches --features std -- --save-baseline ci --warm-up-time 1 --measurement-time 2
        env:
          RUSTFLAGS: -C target-feature=+avx2,+fma
      - uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion

      # Regression guard. Every run compares against the newest master baseline. The threshold is
      # wider than the xtask default because shared runners are noisy.
      #   - On master, a regression fails the run (blocking).
      #   - On a PR, a regression is reported but does not fail the run (informational, ADR 0006
      #     decision 9), until several runs show how noisy the runners are.
      # The comparison runs before the store step, which overwrites base-criterion.
      - name: Restore latest master baseline
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: base-criterion
          key: criterion-master-none
          restore-keys: criterion-master-
      - name: Compare with master baseline (PR, informational)
        if: github.event_name == 'pull_request' && steps.restore.outputs.cache-matched-key != ''
        continue-on-error: true
        run: cargo xtask bench-compare base-criterion target/criterion --tag=ci --max-regression=0.25
      - name: Compare with master baseline (master, blocking)
        if: github.event_name == 'push' && steps.restore.outputs.cache-matched-key != ''
        run: cargo xtask bench-compare base-criterion target/criterion --tag=ci --max-regression=0.25

      # A master run stores its results as the baseline for the next run.
      - name: Store master baseline
        if: github.event_name == 'push'
        run: |
          rm -rf base-criterion
          cp -r target/criterion base-criterion
      - name: Save master baseline cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: base-criterion
          key: criterion-master-${{ github.sha }}
