name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std

  x86-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-C target-feature=+sse4.1"
          - "-C target-feature=+avx2,+fma"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std
        env:
          RUSTFLAGS: -D warnings ${{ matrix.flags }}

  scalar-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std,scalar-only

  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Every combination of each crate's features (std, alloc, scalar-only,
      # nightly, runtime-dispatch, ...) must compile. Lib targets only.
      - run: cargo hack check --workspace --exclude xtask --exclude tpt-simd-testutil --feature-powerset --no-dev-deps
        env:
          RUSTFLAGS: -D warnings

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude tpt-simd-testutil --exclude xtask --target thumbv7em-none-eabihf
      - run: cargo build --workspace --exclude tpt-simd-testutil --exclude xtask --target wasm32-unknown-unknown

  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std

  avx512:
    # Runs the test suite compiled for Skylake-X when the runner CPU has the
    # AVX-512 subsets that target uses. Hosted runners are a mix of Intel and
    # AMD CPUs, so the job checks /proc/cpuinfo rather than assuming support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with AVX-512 enabled (skipped if the CPU lacks it)
        run: |
          if grep -q -w -m1 avx512f /proc/cpuinfo \
            && grep -q -w -m1 avx512bw /proc/cpuinfo \
            && grep -q -w -m1 avx512vl /proc/cpuinfo; then
            cargo test --workspace --features std
          else
            echo "::warning::runner CPU lacks AVX-512F/BW/VL; AVX-512 tests were not run"
          fi
        env:
          RUSTFLAGS: -D warnings -C target-cpu=skylake-avx512

  qemu-riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross-compile check (RVV portable path)
        run: cargo check --workspace --exclude tpt-simd-testutil --exclude xtask --target riscv64gc-unknown-linux-gnu

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins stable, which overrides the nightly installed above; +nightly forces it.
      - run: cargo +nightly miri test --workspace --features std,scalar-only
        env:
          PROPTEST_CASES: "8"
          MIRIFLAGS: -Zmiri-disable-isolation

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
