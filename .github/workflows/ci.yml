name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std

  x86-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-C target-feature=+sse4.1"
          - "-C target-feature=+avx2,+fma"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std
        env:
          RUSTFLAGS: -D warnings ${{ matrix.flags }}

  scalar-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features std,scalar-only

  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Every combination of each crate's features (std, alloc, scalar-only,
      # nightly, runtime-dispatch, ...) must compile. Lib targets only.
      - run: cargo hack check --workspace --exclude xtask --exclude tpt-simd-testutil --feature-powerset --no-dev-deps
        env:
          RUSTFLAGS: -D warnings

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown, riscv32imc-unknown-none-elf, aarch64-unknown-none-softfloat
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --no-default-features --exclude tpt-simd-testutil --exclude xtask --exclude bench-vs --target thumbv7em-none-eabihf
      - run: cargo build --workspace --no-default-features --exclude tpt-simd-testutil --exclude xtask --exclude bench-vs --target wasm32-unknown-unknown
      - run: cargo build --workspace --no-default-features --exclude tpt-simd-testutil --exclude xtask --exclude bench-vs --target riscv32imc-unknown-none-elf
      - run: cargo build --workspace --no-default-features --exclude tpt-simd-testutil --exclude xtask --exclude bench-vs --target aarch64-unknown-none-softfloat

  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bench-vs has no tests; its dev-deps (gemm -> gemm-f16) use fp16 inline asm
      # that needs +fullfp16, which this job does not enable. Keep it out.
      - run: cargo test --workspace --exclude bench-vs --features std

  avx512:
    # Runs the test suite compiled for Skylake-X when the runner CPU has the
    # AVX-512 subsets that target uses. Hosted runners are a mix of Intel and
    # AMD CPUs, so the job checks /proc/cpuinfo rather than assuming support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with AVX-512 enabled (skipped if the CPU lacks it)
        run: |
          if grep -q -w -m1 avx512f /proc/cpuinfo \
            && grep -q -w -m1 avx512bw /proc/cpuinfo \
            && grep -q -w -m1 avx512vl /proc/cpuinfo; then
            cargo test --workspace --features std
          else
            echo "::warning::runner CPU lacks AVX-512F/BW/VL; AVX-512 tests were not run"
          fi
        env:
          RUSTFLAGS: -D warnings -C target-cpu=skylake-avx512

  runtime-dispatch:
    # `runtime-dispatch` is only compiled by feature-powerset; this job runs its tests.
    # Detection happens at run time, so the kernels are selected from the runner's CPU.
    # bench-vs is excluded on aarch64 for the same reason as the aarch64 job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude bench-vs --features std,runtime-dispatch

  vpclmulqdq:
    # The 256-bit VPCLMULQDQ CRC kernel (tpt-simd-hash, entered from 256 bytes) is only
    # reached on CPUs with the instruction, and `skylake-avx512` does not have it. Hosted
    # runners vary, so this checks /proc/cpuinfo first, as the avx512 job does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the VPCLMULQDQ CRC kernel (skipped if the CPU lacks it)
        run: |
          if grep -q -w -m1 vpclmulqdq /proc/cpuinfo && grep -q -w -m1 avx2 /proc/cpuinfo; then
            cargo test -p tpt-simd-hash --features std,runtime-dispatch
          else
            echo "::warning::runner CPU lacks VPCLMULQDQ/AVX2; the wide CRC kernel was not tested"
          fi
        env:
          RUSTFLAGS: -D warnings -C target-cpu=icelake-server

  msrv:
    # `rust-version` in Cargo.toml. `cargo msrv find` confirmed 1.95.0 as the lowest passing
    # toolchain (docs/verification.md); this job keeps it from regressing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  qemu-sve:
    # aarch64 test suite under QEMU user mode with SVE auto-vectorisation enabled, at each
    # vector length. sve-default-vector-length is in bytes: 16/32/64/256 = 128/256/512/2048 bit.
    # The SVE intrinsics are unstable on stable Rust, so this checks the compiler-vectorised
    # paths only; it does not exercise hand-written SVE code (there is none).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vl: [16, 32, 64, 256]
    env:
      RUSTFLAGS: -D warnings -C target-feature=+sve
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu max,sve-default-vector-length=${{ matrix.vl }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - run: cargo test --workspace --exclude bench-vs --exclude xtask --features std --target aarch64-unknown-linux-gnu

  qemu-riscv:
    # riscv64 test suite under QEMU user mode with RVV auto-vectorisation enabled, at each vector
    # length (vlen in bits). The `v` target feature is unstable on stable Rust and rustc warns
    # about it; the warning is not an error under -D warnings. RVV intrinsics are not used.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vlen: [128, 256, 512]
    env:
      RUSTFLAGS: -D warnings -C target-feature=+v
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu rv64,v=true,vlen=${{ matrix.vlen }},elen=64,vext_spec=v1.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
      - run: cargo test --workspace --exclude bench-vs --exclude xtask --features std --target riscv64gc-unknown-linux-gnu

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Tests are split across shards by nextest; each shard runs in its own process.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # Miri's sysroot lives outside target/ and is otherwise rebuilt on every run.
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ steps.date.outputs.date }}
      - run: cargo +nightly miri setup
      # rust-toolchain.toml pins stable, which overrides the nightly installed above; +nightly forces it.
      # Scope: crates that contain `unsafe` code in src/. Crates without `unsafe` (audio, dct, distance,
      # geom, interpolate, math, rng, ...) are left out: most of them depend on libm's x86 routines,
      # which call inline asm that Miri cannot run. Add a crate here when it gains `unsafe`.
      - run: >
          cargo +nightly miri nextest run --no-fail-fast --features std,scalar-only
          --partition count:${{ matrix.shard }}/4
          -p tpt-simd-aligned -p tpt-simd-blas -p tpt-simd-blend -p tpt-simd-butterfly
          -p tpt-simd-compare -p tpt-simd-convolve -p tpt-simd-dot -p tpt-simd-fixed
          -p tpt-simd-gather -p tpt-simd-hash -p tpt-simd-horizontal -p tpt-simd-matrix
          -p tpt-simd-mul -p tpt-simd-permute -p tpt-simd-reduce -p tpt-simd-rounding
          -p tpt-simd-scatter -p tpt-simd-search -p tpt-simd-select -p tpt-simd-shift
          -p tpt-simd-sparse -p tpt-simd-text -p tpt-simd-vector
        env:
          PROPTEST_CASES: "8"
          MIRIFLAGS: -Zmiri-disable-isolation

  # Floors on the SIMD instruction counts of the hot kernels (`cargo xtask asm`). Losing a SIMD
  # path in the kernel fails this job; ordinary codegen changes do not.
  asm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-show-asm
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask asm

  # Smoke run of each libFuzzer target. Long fuzzing is for a manual run; this only catches
  # a kernel that breaks against its reference within a minute.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dot_i16, gather_scatter_i32, transpose_8x8_i16, gemm_f32]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Pin the GNU target: cargo-fuzz can default to musl on Linux, and ASan cannot link
      # against a statically linked (musl) libc.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
        working-directory: fuzz

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
