[package]
name = "tpt-simd-text"
description = "Text kernels: UTF-8 validation, hex, and UTF-8 <-> UTF-16 transcoding, with no runtime dependencies by default"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "utf8", "utf16", "hex", "transcoding"]
categories = ["encoding", "no-std"]

[features]
default = []
std = []
# Detect CPU features once at runtime (x86_64) and select the fastest kernel. Implies `std`.
runtime-dispatch = ["std"]
# Use the simdutf8 SIMD validator for is_valid_utf8 (optional runtime dependency).
simdutf8 = ["dep:simdutf8"]

[dependencies]
simdutf8 = { version = "0.1.5", default-features = false, optional = true }

[dev-dependencies]
# Differential-test oracles only.
simdutf8 = { version = "0.1.5", default-features = false }
faster-hex = { version = "1.0.0", default-features = false }

[lints]
workspace = true
