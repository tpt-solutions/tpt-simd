[package]
name = "tpt-simd-rng"
description = "Lane-parallel xoshiro256++ and Philox4x32-10 generators with SIMD-friendly uniform and normal (Box-Muller) slice fills"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "random", "rng", "xoshiro", "philox"]
categories = ["algorithms", "mathematics", "no-std"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]
# rand_core 0.9 traits for Xoshiro256pp (MIT OR Apache-2.0, no_std, no default features).
rand_core = ["dep:rand_core"]

[dependencies]
tpt-simd-core.workspace = true
rand_core = { version = "0.9", default-features = false, optional = true }

[dev-dependencies]
proptest.workspace = true
libm.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }
rand_xoshiro = "0.7"

[lints]
workspace = true

[[bench]]
name = "rng"
harness = false

[lib]
bench = false
