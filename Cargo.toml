[workspace]
resolver = "3"
members = ["tpt-simd", "tpt-simd-*", "xtask", "bench-vs"]
exclude = ["templates"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-simd"
rust-version = "1.95"
readme = "README.md"
keywords = ["simd", "dsp", "codec", "no_std"]
categories = ["algorithms", "no-std", "multimedia"]

[workspace.dependencies]
libm = { version = "0.2", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false }

tpt-simd-vector = { path = "tpt-simd-vector", version = "0.1.1", default-features = false }
tpt-simd-core = { path = "tpt-simd-core", version = "0.1.1", default-features = false }
tpt-simd-testutil = { path = "tpt-simd-testutil" }  # unpublished (publish = false); path-only so dev-dep is stripped on publish

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Older clippy releases do not know `chunks_exact_to_as_chunks` below; keep them quiet.
unknown_lints = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
should_implement_trait = "allow"
needless_range_loop = "allow"
many_single_char_names = "allow"
# New in clippy 1.98: suggests `as_chunks`, which is less clear in the zip chains used by the kernels and benches.
chunks_exact_to_as_chunks = "allow"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
