[package]
name = "tpt-simd-mul"
description = "SIMD multiply variants (high/low/widening/complex)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "multiply", "complex", "widening", "fma"]
categories = ["algorithms", "mathematics", "no-std"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
proptest.workspace = true
tpt-simd-testutil.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "mul"
harness = false
