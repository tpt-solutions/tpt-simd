[package]
name = "tpt-simd-butterfly"
description = "SIMD FFT/DCT butterfly operations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }
tpt-simd-testutil.workspace = true

[lints]
workspace = true

[[bench]]
name = "butterfly"
harness = false
