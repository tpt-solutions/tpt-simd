[package]
name = "tpt-simd-core"
description = "Core traits, type aliases and feature detection for tpt-simd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "vector", "cpu-detection", "complex", "no_std"]
categories = ["algorithms", "no-std", "hardware-support"]

[features]
default = []
std = ["tpt-simd-vector/std"]
nightly = ["tpt-simd-vector/nightly"]
scalar-only = ["tpt-simd-vector/scalar-only"]

[dependencies]
tpt-simd-vector.workspace = true

[dev-dependencies]
proptest.workspace = true
tpt-simd-testutil.workspace = true

[lints]
workspace = true
