[package]
name = "tpt-simd-ntt"
description = "Montgomery and Barrett modular arithmetic and an in-place number-theoretic transform for 31-bit primes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "ntt", "montgomery", "barrett", "modular"]
categories = ["algorithms", "mathematics", "no-std"]

[features]
default = []
# Forces the scalar butterflies even when AVX2 is enabled at compile time.
scalar-only = []

[dependencies]

[lints]
workspace = true

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
proptest.workspace = true

[[bench]]
name = "kernels"
harness = false
