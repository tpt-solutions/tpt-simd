[package]
name = "tpt-simd-half"
description = "f16/bf16 conversions (wrapping the half crate), slice conversions, and int8 / Q8_0 block quantisation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "f16", "bf16", "quantization", "half"]
categories = ["encoding", "no-std", "mathematics"]

[features]
default = []
std = []
# Detect F16C + AVX at run time (x86_64) and use the hardware conversions for
# the f16/f32 slice functions. Without it, and without `-C target-cpu` enabling
# F16C, the `half` software conversions are used.
runtime-dispatch = ["std"]
# Forces the software conversions even when F16C is available.
scalar-only = []

[dependencies]
half = { version = "2.7.1", default-features = false }
libm.workspace = true

[lints]
workspace = true

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
proptest.workspace = true

[[bench]]
name = "kernels"
harness = false
