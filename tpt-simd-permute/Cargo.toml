[package]
name = "tpt-simd-permute"
description = "SIMD transpose, interleave and permutation helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "permute", "transpose", "interleave", "shuffle"]
categories = ["algorithms", "no-std", "multimedia"]

[features]
default = []
std = ["tpt-simd-core/std", "tpt-simd-saturate/std"]
nightly = ["tpt-simd-core/nightly", "tpt-simd-saturate/nightly"]
scalar-only = ["tpt-simd-core/scalar-only", "tpt-simd-saturate/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true
tpt-simd-saturate = { path = "../tpt-simd-saturate", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }
tpt-simd-testutil.workspace = true

[lints]
workspace = true

[[bench]]
name = "permute"
harness = false
