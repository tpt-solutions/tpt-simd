[package]
name = "tpt-simd-distance"
description = "Vector distances and similarities: inner product, squared L2, cosine, Hamming"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "distance", "similarity", "embedding", "nearest-neighbour"]
categories = ["algorithms", "mathematics", "no-std"]

[features]
default = []
# Forces the portable lane kernels even when AVX2 is enabled at compile time.
scalar-only = []

[dependencies]
libm.workspace = true

[lints]
workspace = true

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
proptest.workspace = true

[[bench]]
name = "kernels"
harness = false
