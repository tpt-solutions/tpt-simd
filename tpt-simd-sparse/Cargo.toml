[package]
name = "tpt-simd-sparse"
description = "Sparse kernels: CSR/CSC SpMV (plain and transposed) and fused vector updates for CG/BiCGSTAB"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["alloc"]
alloc = []
std = ["alloc", "tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
proptest.workspace = true
tpt-simd-gather = { path = "../tpt-simd-gather", version = "0.1.0", default-features = false }
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "sparse"
harness = false

[[example]]
name = "cg"
required-features = ["alloc"]
