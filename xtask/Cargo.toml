[package]
name = "xtask"
description = "Developer tasks for the tpt-simd workspace (run with `cargo xtask`)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
readme = "README.md"
keywords = ["xtask", "ci", "workspace", "tooling", "cargo"]
categories = ["development-tools"]

[dependencies]

# Keep xtask's unit tests out of `cargo bench --benches`, which runs them with libtest and rejects criterion flags.
[[bin]]
name = "xtask"
path = "src/main.rs"
bench = false

[lints]
workspace = true
