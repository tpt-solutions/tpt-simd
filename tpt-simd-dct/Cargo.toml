[package]
name = "tpt-simd-dct"
description = "Table-based DCT-II/III and MDCT/IMDCT for codec-sized blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "dct", "mdct", "audio", "codec"]
categories = ["algorithms", "multimedia::audio", "no-std"]

[features]
default = []
# Forces the scalar matrix-vector products even when AVX2 is enabled at compile time.
scalar-only = []

[dependencies]
libm.workspace = true

[lints]
workspace = true

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
proptest.workspace = true

[[bench]]
name = "kernels"
harness = false
