[package]
name = "tpt-simd"
description = "Umbrella crate re-exporting all tpt-simd crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "dsp", "codec", "fft", "no_std"]
categories = ["algorithms", "no-std", "multimedia", "mathematics"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]
# Detect AVX2+FMA at runtime in kernel crates that have intrinsics paths (ADR 0003).
runtime-dispatch = ["std", "tpt-simd-blas/runtime-dispatch"]

[dependencies]
tpt-simd-core.workspace = true
tpt-simd-complex = { path = "../tpt-simd-complex", version = "0.1.0" }
tpt-simd-fixed = { path = "../tpt-simd-fixed", version = "0.1.0" }
tpt-simd-saturate = { path = "../tpt-simd-saturate", version = "0.1.0" }
tpt-simd-horizontal = { path = "../tpt-simd-horizontal", version = "0.1.0" }
tpt-simd-dot = { path = "../tpt-simd-dot", version = "0.1.0" }
tpt-simd-butterfly = { path = "../tpt-simd-butterfly", version = "0.1.0" }
tpt-simd-mul = { path = "../tpt-simd-mul", version = "0.1.0" }
tpt-simd-aligned = { path = "../tpt-simd-aligned", version = "0.1.0" }
tpt-simd-blend = { path = "../tpt-simd-blend", version = "0.1.0" }
tpt-simd-compare = { path = "../tpt-simd-compare", version = "0.1.0" }
tpt-simd-convolve = { path = "../tpt-simd-convolve", version = "0.1.0" }
tpt-simd-gather = { path = "../tpt-simd-gather", version = "0.1.0" }
tpt-simd-interpolate = { path = "../tpt-simd-interpolate", version = "0.1.0" }
tpt-simd-matrix = { path = "../tpt-simd-matrix", version = "0.1.0" }
tpt-simd-permute = { path = "../tpt-simd-permute", version = "0.1.0" }
tpt-simd-rounding = { path = "../tpt-simd-rounding", version = "0.1.0" }
tpt-simd-scatter = { path = "../tpt-simd-scatter", version = "0.1.0" }
tpt-simd-select = { path = "../tpt-simd-select", version = "0.1.0" }
tpt-simd-shift = { path = "../tpt-simd-shift", version = "0.1.0" }
tpt-simd-window = { path = "../tpt-simd-window", version = "0.1.0" }
tpt-simd-blas = { path = "../tpt-simd-blas", version = "0.1.0" }
tpt-simd-reduce = { path = "../tpt-simd-reduce", version = "0.1.0" }
tpt-simd-math = { path = "../tpt-simd-math", version = "0.1.0" }
tpt-simd-rng = { path = "../tpt-simd-rng", version = "0.1.0" }
tpt-simd-sparse = { path = "../tpt-simd-sparse", version = "0.1.0" }

[lints]
workspace = true
