[package]
name = "tpt-simd-matrix"
description = "Small fixed-size matrix operations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "matrix", "transpose", "linear-algebra", "fixed-size"]
categories = ["algorithms", "mathematics", "no-std"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true
tpt-simd-permute = { path = "../tpt-simd-permute", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
tpt-simd-testutil.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "matrix"
harness = false
