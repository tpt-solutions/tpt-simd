[package]
name = "tpt-simd-gather"
description = "SIMD non-contiguous loads (gather)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "gather", "avx2", "vector", "indexing"]
categories = ["algorithms", "no-std", "hardware-support"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
proptest.workspace = true
tpt-simd-testutil.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "gather"
harness = false
