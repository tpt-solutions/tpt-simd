[package]
name = "tpt-simd-saturate"
description = "SIMD saturating arithmetic and saturating pack operations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "saturating", "pack", "clamp", "pixels"]
categories = ["algorithms", "no-std", "multimedia"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }
tpt-simd-testutil.workspace = true

[lints]
workspace = true

[[bench]]
name = "saturate"
harness = false
