[package]
name = "tpt-simd-math"
description = "Vectorised f32 exp, ln, sin, cos, tanh and erf: branch-free polynomial approximations with documented ULP error"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "math", "exp", "trigonometry", "erf"]
categories = ["mathematics", "algorithms", "science", "no-std"]

[features]
default = []
std = ["tpt-simd-core/std"]
nightly = ["tpt-simd-core/nightly"]
scalar-only = ["tpt-simd-core/scalar-only"]

[dependencies]
tpt-simd-core.workspace = true

[dev-dependencies]
libm.workspace = true
proptest.workspace = true
tpt-simd-testutil.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "math"
harness = false
