[package]
name = "tpt-simd-search"
description = "Byte search, substring search, ASCII case-insensitive search and line counting, with no runtime dependencies by default"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "search", "memchr", "substring", "ascii"]
categories = ["algorithms", "text-processing", "no-std"]

[features]
default = []
std = []
# Detect CPU features once at runtime (x86_64) and select the fastest kernel. Implies `std`.
runtime-dispatch = ["std"]
# Delegate byte and substring search to memchr (optional runtime dependency).
memchr = ["dep:memchr"]

[dependencies]
memchr = { version = "2.8.3", default-features = false, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
proptest.workspace = true
# Differential-test oracle only.
memchr = { version = "2.8.3", default-features = false }

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "kernels"
harness = false
